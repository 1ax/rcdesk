name: Release

# Релиз запускается двумя путями (infra/README.md, раздел «Релиз»):
#  - push в main с поднятой `version` в Cargo.toml: job `version` сам ставит тег
#    v<version> и пушит его. Тег, созданный GITHUB_TOKEN, другой прогон не
#    запускает, поэтому сборка идёт в этом же прогоне. Push без смены версии
#    релиз не создаёт (тег уже есть) -- только деплой (deploy.yml).
#  - push тега vX.Y.Z вручную (резервный путь): тег сверяется с `version`.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Первым делом: какой тег релизим и нужно ли вообще -- иначе не тратим сборку.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Определить тег релиза
        id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            bash infra/release-version-check.sh "$REF_NAME" Cargo.toml
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(bash infra/cargo-version.sh Cargo.toml)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "тег $tag уже есть: версия выпущена, релиз не нужен"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ставлю тег $tag на $GITHUB_SHA"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Гейт релиза: те же проверки, что и в deploy.yml.
  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build-host:
    needs: test
    uses: ./.github/workflows/build-host.yml
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}

  release:
    needs: [version, build-host]
    runs-on: ubuntu-latest
    # Окружение `release` (слайс G): секрет RELEASE_SIGN_KEY живёт в нём, а не в
    # репозитории, и доступен только этому job после одобрения владельца
    # (required reviewer). Остальные job ключ не видят.
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      # Скрипт подписи манифеста лежит в репозитории.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rcdesk-host-windows-x64
          path: dist/windows
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rcdesk-setup-windows-x64
          path: dist/setup
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rcdesk-host-macos-arm64
          path: dist/macos
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rcdesk-macos-pkg
          path: dist/macos-pkg
      # upload/download-artifact теряют бит исполнения -- возвращаем до упаковки.
      - name: Упаковать zip
        run: |
          set -e
          chmod +x dist/macos/rcdesk-host dist/macos/rcdesk-agent
          (cd dist/windows && zip -r ../../rcdesk-windows-x64.zip .)
          (cd dist/macos && zip -r ../../rcdesk-macos-arm64.zip .)
          unzip -l rcdesk-windows-x64.zip
          unzip -l rcdesk-macos-arm64.zip
      # Манифест обновления (D50b): версия и sha256 установщиков, подпись ed25519.
      - name: Подписать манифест обновления
        env:
          RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        run: |
          set -e
          if [ -z "$RELEASE_SIGN_KEY" ]; then
            echo "ошибка: нет секрета RELEASE_SIGN_KEY" >&2
            exit 1
          fi
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGN_KEY" > "$key_file"
          bash infra/release-manifest.sh "${RELEASE_TAG#v}" "$key_file" . \
            dist/setup/rcdesk-setup.exe dist/macos-pkg/rcdesk-macos.pkg
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          # репозиторий для gh задаём явно (не зависим от .git после checkout).
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            rcdesk-windows-x64.zip rcdesk-macos-arm64.zip dist/setup/rcdesk-setup.exe dist/macos-pkg/rcdesk-macos.pkg \
            rcdesk-update.json rcdesk-update.json.sig \
            --title "rcdesk $RELEASE_TAG" --generate-notes
