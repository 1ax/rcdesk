name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Гейт деплоя: переиспользуем CI как reusable workflow. build-push/build-web/
  # deploy зависят от него -- падение гейтов блокирует прод-деплой.
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/1ax/rcdesk-server
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  # Сборка хоста -- reusable build-host.yml (его же вызывает release.yml).
  # Артефакт скачивается со страницы запуска workflow (Actions -> Deploy ->
  # запуск -> Artifacts). deploy от этого job не зависит -- деплой прода не
  # должен ждать сборку хоста.
  build-host:
    needs: test
    uses: ./.github/workflows/build-host.yml
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}

  deploy:
    needs: [build-push, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - name: Deploy over SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ VPS зафиксирован в репо (infra/known_hosts): подмена хоста валит
          # деплой, а не принимается молча (вместо доверия при первом подключении).
          cp infra/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          SSHOPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'mkdir -p ~/app'
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            infra/docker-compose.prod.yml infra/traffic-monitor.sh infra/backup-db.sh "$SSH_USER@$SSH_HOST:~/app/"
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes -r \
            dist/. "$SSH_USER@$SSH_HOST:~/www/rcdesk.app/"
          # Тег образа этого коммита (docker/metadata-action type=sha: 7 символов).
          # Тег передаётся env-переменной удалённому sh, скрипт идёт через heredoc.
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" "IMAGE_TAG=$TAG sh -s" <<'REMOTE'
            set -e
            chmod +x ~/app/traffic-monitor.sh
            chmod +x ~/app/backup-db.sh
            cd ~/app
            C="docker compose -f docker-compose.prod.yml"
            export IMAGE_TAG
            $C pull
            $C up -d --remove-orphans
            for i in $(seq 1 10); do
              r=$(curl -s http://127.0.0.1:8100/healthz || true)
              if [ "$r" = "ok" ]; then echo "health OK"; exit 0; fi
              sleep 3
            done
            echo "health check failed"; exit 1
          REMOTE
