name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Гейт деплоя: переиспользуем CI как reusable workflow. build-push/build-web/
  # deploy зависят от него -- падение гейтов блокирует прод-деплой.
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/1ax/rcdesk-server
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist

  # Кросс-компиляции нет: openh264 собирается из исходников под MSVC, поэтому
  # exe для Windows-стенда владельца собирает CI, а не локальная macOS-машина.
  # Артефакт скачивается со страницы запуска workflow (Actions -> Deploy ->
  # запуск -> Artifacts). deploy от этого job не зависит -- деплой прода не
  # должен ждать сборку хоста.
  build-host:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rcdesk-host-windows-x64
            binary: target/release/rcdesk-host.exe
          - os: macos-latest
            artifact: rcdesk-host-macos-arm64
            binary: target/release/rcdesk-host
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p rcdesk-host
      - name: Дымовая проверка -- бинарник запускается
        run: cargo run --release -p rcdesk-host -- --version
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  deploy:
    needs: [build-push, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: dist
      - name: Deploy over SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSHOPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'mkdir -p ~/app'
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            infra/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:~/app/"
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -r \
            dist/. "$SSH_USER@$SSH_HOST:~/www/rcdesk.app/"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'set -e
            cd ~/app
            C="docker compose -f docker-compose.prod.yml"
            $C pull
            $C up -d --remove-orphans
            for i in $(seq 1 10); do
              r=$(curl -s http://127.0.0.1:8100/healthz || true)
              if [ "$r" = "ok" ]; then echo "health OK"; exit 0; fi
              sleep 3
            done
            echo "health check failed"; exit 1'
