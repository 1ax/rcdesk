name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Гейт деплоя: переиспользуем CI как reusable workflow. build-push/build-web/
  # deploy зависят от него -- падение гейтов блокирует прод-деплой.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/1ax/rcdesk-server
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-dist
          path: web/dist

  # Сборка хоста -- reusable build-host.yml (его же вызывает release.yml).
  # Артефакт скачивается со страницы запуска workflow (Actions -> Deploy ->
  # запуск -> Artifacts). deploy от этого job не зависит -- деплой прода не
  # должен ждать сборку хоста.
  build-host:
    needs: test
    uses: ./.github/workflows/build-host.yml
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}

  deploy:
    needs: [build-push, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-dist
          path: dist
      - name: Deploy over SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ VPS зафиксирован в репо (infra/known_hosts): подмена хоста валит
          # деплой, а не принимается молча (вместо доверия при первом подключении).
          cp infra/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          SSHOPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'mkdir -p ~/app'
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            infra/docker-compose.prod.yml infra/traffic-monitor.sh infra/backup-db.sh "$SSH_USER@$SSH_HOST:~/app/"
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes -r \
            dist/. "$SSH_USER@$SSH_HOST:~/www/rcdesk.app/"
          # Тег образа этого коммита (docker/metadata-action type=sha: 7 символов).
          # Тег передаётся env-переменной удалённому sh, скрипт идёт через heredoc.
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" "IMAGE_TAG=$TAG sh -s" <<'REMOTE'
            set -e
            chmod +x ~/app/traffic-monitor.sh
            chmod +x ~/app/backup-db.sh
            cd ~/app
            C="docker compose -f docker-compose.prod.yml"
            export IMAGE_TAG
            $C pull
            $C up -d --remove-orphans
            for i in $(seq 1 10); do
              r=$(curl -s http://127.0.0.1:8100/healthz || true)
              if [ "$r" = "ok" ]; then echo "health OK"; exit 0; fi
              sleep 3
            done
            echo "health check failed"; exit 1
          REMOTE
