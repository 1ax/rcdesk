name: CI

on:
  # На push в main гейты гоняет deploy.yml (вызывает этот workflow как reusable),
  # отдельный запуск CI там был бы дублем. Ветки и PR проверяются здесь.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      # CI-2: у GitHub бывает нехватка раннеров macOS arm64 -- джоба 15 мин ждёт
      # раннер и отменяется («not acquired by Runner»), прогон становится
      # cancelled (continue-on-error отмену не гасит -- проверено). Deploy
      # выкатывает только сервер и веб, поэтому гоняет rust без macOS; Release
      # (гейт сборки хоста) и ветки -- со всеми тремя ОС.
      skip_macos:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.skip_macos && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Патчи vendor/ (rtc-sctp, rtc-turn, scap) должны реально применяться:
      # cargo при неподошедшем [patch] лишь пишет warning, CI остался бы зелёным.
      - name: vendor patches are applied
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 >/dev/null 2>err.txt
          cat err.txt
          if grep -i "was not used" err.txt; then
            echo "ошибка: [patch] из Cargo.toml не применён" >&2
            exit 1
          fi
          for c in rtc-sctp rtc-turn scap; do
            cargo tree -i "$c" --locked --target all | head -1 | grep -qE "vendor[/\\\\]$c\)" \
              || { echo "ошибка: $c собирается не из vendor/$c" >&2; exit 1; }
          done
      - name: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.os != 'windows-latest'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # CI-1: 2026-11-05 `rcdesk-host --lib` один раз упал с SIGSEGV на ubuntu
      # (Deploy 18884a2) без стека; 227 полных прогонов подряд на wip/ci1-probe
      # его не повторили. Core-дамп включён, чтобы следующий случай дал стек.
      - name: enable core dumps
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - name: cargo test --workspace
        if: matrix.os != 'windows-latest'
        run: |
          ulimit -c unlimited || true
          cargo test --locked --workspace
      - name: backtrace from core dump
        if: failure() && matrix.os == 'ubuntu-latest'
        run: |
          ls -l /tmp/core.* 2>/dev/null || { echo "core-дампов нет"; exit 0; }
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          for c in /tmp/core.*; do
            exe=$(file "$c" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
            echo "=== $c ($exe)"
            gdb -batch -ex bt -ex 'thread apply all bt 25' "$exe" "$c" 2>&1 | grep -v '^\[New LWP' | head -400
          done
      # rcdesk-server с фичами по умолчанию тянет OpenSSL (webauthn-rs) и
      # работает только на Linux: на Windows-раннере OpenSSL нет, поэтому
      # целиком сервер там не собираем. Без фич (`--no-default-features`, без
      # passkey и SMTP) он OpenSSL не тянет и собирается на Windows: так его
      # подключит хост (LAN-хаб). Эту же конфигурацию гоняем и на Linux.
      - name: cargo clippy --workspace --exclude rcdesk-server (windows)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --locked --workspace --exclude rcdesk-server --all-targets -- -D warnings
      - name: cargo test --workspace --exclude rcdesk-server (windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --locked --workspace --exclude rcdesk-server
      - name: cargo clippy -p rcdesk-server --no-default-features (windows)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --locked -p rcdesk-server --no-default-features --all-targets -- -D warnings
      - name: cargo test -p rcdesk-server --no-default-features (windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --locked -p rcdesk-server --no-default-features
      - name: cargo clippy -p rcdesk-server --no-default-features
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -p rcdesk-server --no-default-features --all-targets -- -D warnings
      - name: cargo test -p rcdesk-server --no-default-features
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p rcdesk-server --no-default-features

  # Тесты патчей vendor/ (каталог вне workspace, в `cargo test --workspace` не входят).
  vendor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            vendor/rtc-sctp
            vendor/rtc-turn
      - name: cargo test vendor/rtc-sctp
        run: cargo test --manifest-path vendor/rtc-sctp/Cargo.toml --lib --locked
      - name: cargo test vendor/rtc-turn
        run: cargo test --manifest-path vendor/rtc-turn/Cargo.toml --lib --locked

  proto-ts-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test -p rcdesk-proto
        run: cargo test --locked -p rcdesk-proto
      - name: check generated TS bindings match committed files
        run: |
          git add -N web/src/generated
          git diff --exit-code -- web/src/generated

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  infra-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck infra/*.sh
        run: shellcheck infra/*.sh
      - name: shellcheck installer/macos
        run: shellcheck installer/macos/build-pkg.sh installer/macos/scripts/*
      - name: bash infra/traffic-monitor.test.sh
        run: bash infra/traffic-monitor.test.sh
      - name: bash infra/backup-db.test.sh
        run: bash infra/backup-db.test.sh
      - name: bash infra/cargo-version.test.sh
        run: bash infra/cargo-version.test.sh
      - name: bash infra/release-version-check.test.sh
        run: bash infra/release-version-check.test.sh
      - name: bash infra/release-manifest.test.sh
        run: bash infra/release-manifest.test.sh

  # Известные уязвимости зависимостей (RustSec). Токен нужен action для отчёта.
  cargo-audit:
    runs-on: ubuntu-latest
    # `audit-check` публикует находки как check-run. Без `checks: write` он падает
    # с `Resource not accessible by integration`, едва появляется что сообщать, и
    # роняет гейт -- хотя уязвимостей нет (инцидент 2026-10-23: отозванный
    # clipboard-win 5.4.1 уронил релиз 0.2.1). Право нужно и у вызывающих джобов
    # в deploy.yml/release.yml: reusable-прогон получает права от вызывающего.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
