name: CI

on:
  # На push в main гейты гоняет deploy.yml (вызывает этот workflow как reusable),
  # отдельный запуск CI там был бы дублем. Ветки и PR проверяются здесь.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.os != 'windows-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        if: matrix.os != 'windows-latest'
        run: cargo test --workspace
      # rcdesk-server тянет OpenSSL (webauthn-rs) и работает только на Linux:
      # на Windows-раннере OpenSSL нет, поэтому сервер там не собираем.
      - name: cargo clippy --workspace --exclude rcdesk-server (windows)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --workspace --exclude rcdesk-server --all-targets -- -D warnings
      - name: cargo test --workspace --exclude rcdesk-server (windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --exclude rcdesk-server

  proto-ts-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test -p rcdesk-proto
        run: cargo test -p rcdesk-proto
      - name: check generated TS bindings match committed files
        run: git diff --exit-code -- web/src/generated

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  infra-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck infra/*.sh
        run: shellcheck infra/*.sh
      - name: shellcheck installer/macos
        run: shellcheck installer/macos/build-pkg.sh installer/macos/scripts/*
      - name: bash infra/traffic-monitor.test.sh
        run: bash infra/traffic-monitor.test.sh
      - name: bash infra/backup-db.test.sh
        run: bash infra/backup-db.test.sh
      - name: bash infra/cargo-version.test.sh
        run: bash infra/cargo-version.test.sh
      - name: bash infra/release-version-check.test.sh
        run: bash infra/release-version-check.test.sh
      - name: bash infra/release-manifest.test.sh
        run: bash infra/release-manifest.test.sh

  # Известные уязвимости зависимостей (RustSec). Токен нужен action для отчёта.
  cargo-audit:
    runs-on: ubuntu-latest
    # `audit-check` публикует находки как check-run. Без `checks: write` он падает
    # с `Resource not accessible by integration`, едва появляется что сообщать, и
    # роняет гейт -- хотя уязвимостей нет (инцидент 2026-10-23: отозванный
    # clipboard-win 5.4.1 уронил релиз 0.2.1). Право нужно и у вызывающих джобов
    # в deploy.yml/release.yml: reusable-прогон получает права от вызывающего.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
