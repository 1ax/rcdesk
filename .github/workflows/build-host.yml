name: Build host

# Сборка rcdesk-host/rcdesk-agent под Windows и macOS. Reusable: вызывается из
# deploy.yml (промежуточные сборки -- артефакты Actions) и release.yml (релизы).
on:
  workflow_call:
    # Ключ подписи macOS (4.3c): .p12 в base64 и его пароль. Не заданы (форки,
    # PR) -- build-pkg.sh подписывает ad-hoc, сборка не падает.
    secrets:
      MACOS_SIGN_P12:
        required: false
      MACOS_SIGN_P12_PASSWORD:
        required: false
  # Ручной запуск с любой ветки (`gh workflow run build-host.yml --ref wip/…`):
  # установщик для живой проверки на стенде до слияния в main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Кросс-компиляции нет: openh264 собирается из исходников под MSVC, поэтому
  # exe для Windows-стенда владельца собирает CI, а не локальная macOS-машина.
  # Артефакты скачиваются со страницы запуска вызывающего workflow (Actions ->
  # запуск -> Artifacts) либо упаковываются в релиз (release.yml).
  build-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rcdesk-host-windows-x64
            binary: target/release/rcdesk-host.exe
            agent_binary: target/release/rcdesk-agent.exe
          - os: macos-latest
            artifact: rcdesk-host-macos-arm64
            binary: target/release/rcdesk-host
            agent_binary: target/release/rcdesk-agent
    runs-on: ${{ matrix.os }}
    # Без web/dist сборка хоста падает, а не отдаёт заглушку хаба. На уровне job,
    # чтобы дымовые `cargo run --release` ниже не пересобирали хост из-за смены
    # переменной окружения (build.rs следит за ней).
    env:
      RCDESK_REQUIRE_WEB: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release
      # Веб-клиент вшивается в хост (LAN-хаб, D47-3): build.rs берёт web/dist.
      # Версия Node и действие -- как в job `web` из ci.yml.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Собрать веб-клиент
        working-directory: web
        run: |
          npm ci
          npm run build
      # Собирает оба [[bin]] пакета rcdesk-host (rcdesk-host и rcdesk-agent) --
      # `cargo build -p <pkg>` без `--bin` строит все бинарники пакета, так
      # что `autostart status` ниже находит rcdesk-agent уже рядом (слайс 2.6d).
      - run: cargo build --release -p rcdesk-host
      - name: Дымовая проверка -- бинарник запускается
        run: |
          cargo run --release -p rcdesk-host -- --version
          cargo run --release -p rcdesk-host -- autostart status
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.agent_binary }}
          if-no-files-found: error
      # Установщик Windows (4.3b): Inno Setup из choco, версия закреплена.
      # Собираем из тех же exe, что лежат в артефакте выше (target/release).
      - name: Версия хоста из Cargo
        if: runner.os == 'Windows'
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object { $_.name -eq 'rcdesk-host' }).version
          if (-not $v) { throw 'версия rcdesk-host не найдена в cargo metadata' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"
      - name: Установить Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --version 6.7.1 -y --no-progress
      - name: Собрать установщик
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # choco кладёт Inno Setup в Program Files (x86); PATH не полагаемся.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe не найден: $($candidates -join '; ')" }
          $src = (Resolve-Path 'target/release').Path
          $out = Join-Path $env:GITHUB_WORKSPACE 'installer-out'
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$src" "/O$out" 'installer/windows/rcdesk.iss'
          if ($LASTEXITCODE -ne 0) { throw "iscc завершился с кодом $LASTEXITCODE" }
          Get-ChildItem $out
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: runner.os == 'Windows'
        with:
          name: rcdesk-setup-windows-x64
          path: installer-out/rcdesk-setup.exe
          if-no-files-found: error
      # Установщик macOS (4.3c): rcdesk.app + rcdesk-macos.pkg, подпись
      # самоподписанным сертификатом из секретов (installer/macos/build-pkg.sh).
      - name: Версия хоста из Cargo (macOS)
        if: runner.os == 'macOS'
        id: mac_version
        run: |
          v="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rcdesk-host") | .version')"
          if [ -z "$v" ] || [ "$v" = "null" ]; then echo 'версия rcdesk-host не найдена в cargo metadata' >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version=$v"
      - name: Собрать pkg
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: bash installer/macos/build-pkg.sh target/release "${{ steps.mac_version.outputs.version }}" pkg-out
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: runner.os == 'macOS'
        with:
          name: rcdesk-macos-pkg
          path: pkg-out/rcdesk-macos.pkg
          if-no-files-found: error
