[package]
name = "rcdesk-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "rcdesk_host"
path = "src/lib.rs"

[[bin]]
name = "rcdesk-host"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
openh264 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
webrtc = { workspace = true }
rtc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
proto = { package = "rcdesk-proto", path = "../proto" }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tungstenite подключает rustls с default-features=false — без `tls12` rustls умеет только
# TLS 1.3, а nginx на VPS отдаёт только TLS 1.2 (алерт ProtocolVersion). Провайдер ring —
# тот же, что уже в графе.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
futures-util = "0.3"
base64 = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
scap = { workspace = true }
enigo = { workspace = true }

# scap 0.0.8 вызывает пятиаргументный `Settings::new`, который сломан в windows-capture 1.5+
# (там 8 аргументов). Прямой пин держит lock-файл на совместимой версии даже после
# `cargo update`. Убрать при переходе на прямой windows-capture 2.x (долг D3/D5).
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"
# Версия совпадает с той, что уже тянет windows-capture 1.4.4 (см. Cargo.lock) --
# не добавляет вторую версию `windows` в граф.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Версии совпадают с теми, что уже тянет `enigo` для macOS (см. Cargo.lock) --
# не добавляет вторую версию objc2*/ в граф.
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSGeometry",
    "NSData",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
