[package]
name = "rcdesk-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "rcdesk_host"
path = "src/lib.rs"

[[bin]]
name = "rcdesk-host"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
openh264 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
webrtc = { workspace = true }
rtc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
proto = { package = "rcdesk-proto", path = "../proto" }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tungstenite подключает rustls с default-features=false — без `tls12` rustls умеет только
# TLS 1.3, а nginx на VPS отдаёт только TLS 1.2 (алерт ProtocolVersion). Провайдер ring —
# тот же, что уже в графе.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
futures-util = "0.3"
base64 = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
scap = { workspace = true }
enigo = { workspace = true }

# scap 0.0.8 вызывает пятиаргументный `Settings::new`, который сломан в windows-capture 1.5+
# (там 8 аргументов). Прямой пин держит lock-файл на совместимой версии даже после
# `cargo update`. Убрать при переходе на прямой windows-capture 2.x (долг D3/D5).
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"
# Версия совпадает с той, что уже тянет windows-capture 1.4.4 (см. Cargo.lock) --
# не добавляет вторую версию `windows` в граф.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # `D3D11CreateDevice` (see `platform::windows::d3d`) is gated on both
    # Direct3D11 *and* Dxgi in the `windows` crate itself (its `padapter`
    # parameter requires `IDXGIAdapter`, from `Win32_Graphics_Dxgi`) even
    # though this crate never names a Dxgi type directly.
    "Win32_Graphics_Dxgi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Версии совпадают с теми, что уже тянет `enigo` для macOS (см. Cargo.lock) --
# не добавляет вторую версию objc2*/ в граф.
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSGeometry",
    "NSData",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
# CoreFoundation container/number/string types used to build VideoToolbox's
# encoder-specification/property/frame-property dictionaries (encode::videotoolbox).
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFBase",
    "CFString",
    "CFNumber",
    "CFDictionary",
    "CFArray",
] }
# CVPixelBuffer: the image container VideoToolbox's compression session
# encodes from -- built and filled from each `RawFrame` in encode::videotoolbox.
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
# CMTime/CMSampleBuffer/CMBlockBuffer/CMFormatDescription: VideoToolbox's
# encoded output comes back as a CMSampleBuffer (AVCC H.264 in a
# CMBlockBuffer, SPS/PPS in its CMFormatDescription) that encode::videotoolbox
# converts to this crate's Annex-B `EncodedFrame`.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMTime",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "objc2-core-video",
] }
# The hardware H.264 encoder itself (VTCompressionSession) -- see
# docs/host-libs-api-notes.md's VideoToolbox section for the API notes this
# module (encode::videotoolbox) was written against.
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
    "std",
    "VTBase",
    "VTErrors",
    "VTSession",
    "VTCompressionSession",
    "VTCompressionProperties",
    "objc2-core-media",
    "objc2-core-video",
] }
