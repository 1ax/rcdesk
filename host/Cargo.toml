[package]
name = "rcdesk-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Two [[bin]]s below (`rcdesk-host`, `rcdesk-agent`) make `cargo run -p
# rcdesk-host -- ...` ambiguous without a default -- see docs/dev-run.md and
# the CI deploy smoke test, both of which run the CLI without naming a
# binary.
default-run = "rcdesk-host"

[lib]
name = "rcdesk_host"
path = "src/lib.rs"

[[bin]]
name = "rcdesk-host"
path = "src/main.rs"

[[bin]]
name = "rcdesk-agent"
path = "src/agent_main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
openh264 = { workspace = true }
# Direct dependency for the raw FFI types `openh264` doesn't reexport
# (ENCODER_OPTION_BITRATE, SBitrateInfo, ...) that encode::openh264::set_rate
# needs to change bitrate on a live encoder via `Encoder::raw_api`. Same
# 0.9.8 already pulled in transitively through `openh264`'s own dependency.
openh264-sys2 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
webrtc = { workspace = true }
rtc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
proto = { package = "rcdesk-proto", path = "../proto" }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tungstenite подключает rustls с default-features=false — без `tls12` rustls умеет только
# TLS 1.3, а nginx на VPS отдаёт только TLS 1.2 (алерт ProtocolVersion). Провайдер ring —
# тот же, что уже в графе.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
futures-util = "0.3"
base64 = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
scap = { workspace = true }
enigo = { workspace = true }
tray-icon = { version = "0.25", default-features = false }

# scap 0.0.8 вызывает пятиаргументный `Settings::new`, который сломан в windows-capture 1.5+
# (там 8 аргументов). Прямой пин держит lock-файл на совместимой версии даже после
# `cargo update`. Убрать при переходе на прямой windows-capture 2.x (долг D3/D5).
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"
# Версия совпадает с той, что уже тянет windows-capture 1.4.4 (см. Cargo.lock) --
# не добавляет вторую версию `windows` в граф.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # `D3D11CreateDevice` (see `platform::windows::d3d`) is gated on both
    # Direct3D11 *and* Dxgi in the `windows` crate itself (its `padapter`
    # parameter requires `IDXGIAdapter`, from `Win32_Graphics_Dxgi`) even
    # though this crate never names a Dxgi type directly.
    "Win32_Graphics_Dxgi",
    # Media Foundation H.264 encoder MFT (encode::mediafoundation): MFT
    # enumeration/activation, IMFTransform, media types, samples/buffers.
    "Win32_Media_MediaFoundation",
    # CoInitializeEx/CoTaskMemFree -- MFTEnumEx needs COM initialized on the
    # thread, and hands back its MFT_REGISTER_TYPE_INFO/friendly-name
    # allocations via CoTaskMemAlloc, freed with CoTaskMemFree. Also gates
    # ICodecAPI::SetValue together with the two features below (the `windows`
    # crate requires all three on that one method).
    "Win32_System_Com",
    "Win32_System_Ole",
    # VARIANT, the value type ICodecAPI::SetValue takes.
    "Win32_System_Variant",
    # GetClipboardSequenceNumber (clipboard::windows) -- cheap OS change
    # counter, polled instead of reading the clipboard on every tick (2.5b).
    "Win32_System_DataExchange",
    # SetThreadExecutionState (platform::windows::event_loop, 2.6c) -- keeps
    # the display/system awake for the duration of an active session, the
    # Windows equivalent of macOS's NSProcessInfo activity below.
    "Win32_System_Power",
    # RegOpenKeyExW/RegSetValueExW/RegGetValueW/RegDeleteKeyValueW/RegCloseKey
    # (platform::windows::autostart, 2.6d) -- the HKCU Run-key "start at
    # login" registration, the Windows counterpart of macOS's LaunchAgent
    # plist.
    "Win32_System_Registry",
] }
# Буфер обмена (2.5b): текст только, default-features=false drops the
# `image-data` feature (image crate, extra objc2-core-graphics on macOS).
# On Windows arboard unconditionally pulls `clipboard-win` 5, which pulls a
# second copy of `windows-sys` (<0.61) alongside our `windows` 0.61 -- an
# accepted, separate crate family, not a duplicate of the same crate.
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Версии совпадают с теми, что уже тянет `enigo` для macOS (см. Cargo.lock) --
# не добавляет вторую версию objc2*/ в граф.
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSGeometry",
    "NSData",
    # NSHost::currentHost().localizedName() (platform::macos::computer_name,
    # slice 2.6a). NSHost's own feature gate is just "NSHost", but
    # `localizedName()` returns `Option<Retained<NSString>>`, and the
    # NSString type itself lives behind objc2-foundation's separate
    # "NSString" feature (see src/generated/mod.rs in the crate source) --
    # without it NSString doesn't exist in this crate at all, so both are
    # needed together for this one new call.
    "NSHost",
    "NSString",
    # NSDate/NSRunLoop (platform::macos::event_loop, 2.6c): the `until`
    # deadline and run-loop mode for `nextEventMatchingMask_untilDate_inMode_dequeue`.
    "NSDate",
    "NSRunLoop",
    # NSProcessInfo.processInfo().beginActivityWithOptions_reason/endActivity
    # (platform::macos::event_loop, 2.6c) -- keeps the tray agent from being
    # App Nap-throttled while a session is active (no windows, no user
    # interaction to otherwise tell macOS the process is doing real work).
    "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    # NSPasteboard.generalPasteboard().changeCount() (clipboard::macos): cheap
    # OS change counter, polled instead of reading the clipboard every tick (2.5b).
    "NSPasteboard",
    # NSApplication/NSResponder/NSEvent (platform::macos::event_loop, 2.6c):
    # the tray agent's own minimal main-thread run loop --
    # `sharedApplication`/`finishLaunching`/`nextEventMatchingMask_untilDate_inMode_dequeue`/
    # `sendEvent`. NSRunningApplication for `setActivationPolicy` (Accessory,
    # so the agent has no Dock icon).
    "NSApplication",
    "NSResponder",
    "NSEvent",
    "NSRunningApplication",
] }
# Буфер обмена (2.5b), тот же default-features=false что для Windows выше --
# нужен только текст.
arboard = { version = "3.6", default-features = false }
# CoreFoundation container/number/string types used to build VideoToolbox's
# encoder-specification/property/frame-property dictionaries (encode::videotoolbox).
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFBase",
    "CFString",
    "CFNumber",
    "CFDictionary",
    "CFArray",
] }
# CVPixelBuffer: the image container VideoToolbox's compression session
# encodes from -- built and filled from each `RawFrame` in encode::videotoolbox.
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
# CMTime/CMSampleBuffer/CMBlockBuffer/CMFormatDescription: VideoToolbox's
# encoded output comes back as a CMSampleBuffer (AVCC H.264 in a
# CMBlockBuffer, SPS/PPS in its CMFormatDescription) that encode::videotoolbox
# converts to this crate's Annex-B `EncodedFrame`.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMTime",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "objc2-core-video",
] }
# The hardware H.264 encoder itself (VTCompressionSession) -- see
# docs/host-libs-api-notes.md's VideoToolbox section for the API notes this
# module (encode::videotoolbox) was written against.
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
    "std",
    "VTBase",
    "VTErrors",
    "VTSession",
    "VTCompressionSession",
    "VTCompressionProperties",
    "objc2-core-media",
    "objc2-core-video",
] }
