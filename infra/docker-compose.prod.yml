# Production docker-compose для rcdesk.
# Запускается на сервере из ~/app (пользователь rcdesk) рядом с .env (chmod 600).
# server публикуется ТОЛЬКО на 127.0.0.1 -- внешний FastPanel-Nginx на этом же
# сервере проксирует /ws и /healthz на 127.0.0.1:8100 (см. ARCHITECTURE.md §11).
# Образ тянется из ghcr.io (публикуется .github/workflows/deploy.yml).
#
# Имя проекта задано явно: без него compose берёт имя каталога (`app`), а на этом
# VPS так же называется проект crewtally -- первый деплой rcdesk с --remove-orphans
# снёс её контейнеры (инцидент 2026-09-11, долг D25).

name: rcdesk

services:
  server:
    image: ghcr.io/1ax/rcdesk-server:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8100:8080"
    env_file: .env
    # Именованный том, не bind-mount в ~/app/data: на пустом томе docker
    # наследует владельца/права из каталога /data образа (создан как
    # nobody:nogroup в server/Dockerfile), поэтому процесс внутри
    # контейнера (USER nobody) может писать в SQLite-файл без ручного
    # `chown` на VPS -- у пользователя rcdesk там нет root. `RCDESK_DB_PATH`
    # уже задан в образе (ENV), дублировать его тут не нужно.
    volumes:
      - db-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped

  # host-сеть: coturn относится к диапазону relay-портов (49152-65535) через
  # публикацию по одному в compose непрактично, а TURN должен видеть внешний
  # IP клиентов напрямую (не за NAT контейнерной сети).
  coturn:
    image: coturn/coturn:4
    network_mode: host
    restart: unless-stopped
    command:
      - "--listening-port=3478"
      - "--realm=rcdesk.app"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--no-tls"
      - "--no-cli"
      - "--fingerprint"
      - "--log-file=stdout"
      - "--no-multicast-peers"
      # Метрики только на localhost (host-сеть), порт 9641 по умолчанию --
      # читает infra/traffic-monitor.sh (ARCHITECTURE.md §11).
      - "--prometheus"
      - "--prometheus-address=127.0.0.1"

volumes:
  db-data:
