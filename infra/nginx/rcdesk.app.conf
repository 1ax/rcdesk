# Полный конфиг сайта rcdesk.app в nginx FastPanel -- источник правды в репо.
# На VPS лежит в /etc/nginx/fastpanel2-sites/rcdesk/rcdesk.app.conf (root).
# Применение: заменить файл целиком, затем `nginx -t && systemctl reload nginx`.
# Строки панели (listen, ssl_certificate*, root, include, *_log) -- как у панели;
# при перевыпуске сертификата панель меняет пути к .crt/.key -- взять из живого файла.
#
# Свои добавки (слайс C, аудит, D39):
#  - security-заголовки на уровне server (HSTS, nosniff, X-Frame-Options, Referrer-Policy);
#  - `Cache-Control: no-cache` на index.html, immutable на хешированные ассеты Vite;
#  - CSP (enforcing с 2026-10-13: Report-Only прошёл живой сеанс без нарушений).
#    Если новый код клиента упрётся в CSP -- временно вернуть Report-Only.
# ВАЖНО: `add_header` внутри `location` отменяет наследование `add_header` из
# `server`, поэтому в location с Cache-Control четыре заголовка повторены явно.
# `location ^~ /assets/` стоит до regex-location статики: `^~` выигрывает у регулярок,
# иначе ассеты ушли бы в общий static-блок без Cache-Control.

server {
    server_name rcdesk.app www.rcdesk.app ;

    listen 46.36.221.168:80;
    listen 46.36.221.168:443 ssl;

    ssl_certificate "/var/www/httpd-cert/rcdesk.app_2026-09-11-19-41_42.crt";
    ssl_certificate_key "/var/www/httpd-cert/rcdesk.app_2026-09-11-19-41_42.key";

    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css image/x-ico application/pdf image/jpeg image/png image/gif application/javascript application/x-javascript application/x-pointplus;
    gzip_comp_level 1;

    set $root_path /var/www/rcdesk/data/www/rcdesk.app;
    root $root_path;
    disable_symlinks if_not_owner from=$root_path;

    # rcdesk: security-заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # rcdesk: CSP (слайс C). OPAQUE -- WebAssembly ('wasm-unsafe-eval'), скачивание
    # файлов через blob:, сигналинг wss://rcdesk.app/ws; WebRTC CSP не регулирует.
    set $rcdesk_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' wss://rcdesk.app; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # rcdesk: сигналинг по WebSocket -> контейнер на 127.0.0.1:8100
    location /ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # rcdesk: healthcheck контейнера
    location = /healthz {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
    }

    # rcdesk: index.html всегда перепроверяется браузером (D39); `/` отдаёт его
    # через index -> внутренний редирект сюда же.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $rcdesk_csp always;
        # повтор заголовков server (add_header в location отменяет наследование)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $rcdesk_csp always;
        # повтор заголовков server (add_header в location отменяет наследование)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # rcdesk: хешированные ассеты Vite (/assets/index-<hash>.js|css) -- навсегда.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # повтор заголовков server (add_header в location отменяет наследование)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|ogg|otf|pdf|ttf|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri $uri/ =404;
    }

    include "/etc/nginx/fastpanel2-sites/rcdesk/rcdesk.app.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/rcdesk/data/logs/rcdesk.app-frontend.error.log;
    access_log /var/www/rcdesk/data/logs/rcdesk.app-frontend.access.log;
}
