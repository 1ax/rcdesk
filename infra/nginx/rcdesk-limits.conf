# Зона лимита соединений для rcdesk (S-2). Контекст `http`.
# На VPS кладётся в /etc/nginx/conf.d/rcdesk-limits.conf (root) -- ДО применения
# rcdesk.app.conf, иначе `nginx -t` не найдёт зону `rcdesk_ws`.
# FastPanel include-ит conf.d/*.conf в http; проверить: `nginx -T | grep conf.d`.
# Применение: `nginx -t && systemctl reload nginx`.

limit_conn_zone $binary_remote_addr zone=rcdesk_ws:1m;
