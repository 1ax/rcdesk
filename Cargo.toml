[workspace]
resolver = "2"
members = ["proto", "host", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
ts-rs = "12"
axum = { version = "0.8", features = ["ws"] }
rand = "0.10"
openh264 = "0.9"
openh264-sys2 = "0.9"
scap = "0.0.8"
clap = { version = "4", features = ["derive"] }
webrtc = "0.20"
rtc = "0.20"
bytes = "1"
async-trait = "0.1"
enigo = "0.6"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
opaque-ke = { version = "4.0", features = ["argon2"] }
argon2 = "0.5"
sha2 = "0.10"
rpassword = "7"
hmac = "0.12"
