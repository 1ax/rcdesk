[workspace]
resolver = "2"
members = ["proto", "host", "server"]
exclude = ["vendor"]

[workspace.package]
version = "0.4.9"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
ts-rs = "12"
axum = { version = "0.8", features = ["ws"] }
rand = "0.10"
openh264 = "0.9"
openh264-sys2 = "0.9"
scap = "0.0.8"
clap = { version = "4", features = ["derive"] }
webrtc = "0.20"
rtc = "0.20"
bytes = "1"
async-trait = "0.1"
enigo = "0.6"
base64 = "0.23"
rusqlite = { version = "0.42", features = ["bundled"] }
opaque-ke = { version = "4.0", features = ["argon2"] }
argon2 = "0.5"
sha2 = "0.10"
rpassword = "7"
hmac = "0.12"

# V-13: значения совпадают с умолчаниями cargo и записаны явно, чтобы их не
# «оптимизировали» мимоходом (обоснование -- ARCHITECTURE §4.1, «Профиль release»).
[profile.release]
# Хост изолирует панику потока захвата/кодера и перезапускает конвейер (D58, V-2);
# с `abort` любая паника в vendor-коде роняла бы агент вместе с сеансом.
panic = "unwind"
# Имена функций нужны в системных отчётах о падении (FFI: SCK, VT, MF, GDI),
# поэтому срезается только отладочная информация std (как и по умолчанию).
# На macOS "symbols" дал бы 21.4 -> 16.6 МБ; "none" -- 22.3 МБ.
strip = "debuginfo"
lto = false
codegen-units = 16

[patch.crates-io]
rtc-sctp = { path = "vendor/rtc-sctp" }
rtc-turn = { path = "vendor/rtc-turn" }
scap = { path = "vendor/scap" }
